<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Manager</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10141c; color: #e8e8e8; font-family: 'Courier New', monospace; }
      #app { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
      #hud { display: flex; gap: 16px; align-items: center; font-size: 18px; }
      #hud .score { font-size: 26px; font-weight: bold; letter-spacing: 2px; }
      button { background: #223047; color: #e8e8e8; border: 2px solid #3d5a80; font-family: inherit; font-size: 14px; padding: 4px 12px; cursor: pointer; }
      button.active { background: #3d5a80; }
      #ticker { width: 840px; max-width: 95vw; height: 72px; overflow-y: auto; background: #0b0e14; border: 2px solid #223047; padding: 6px 10px; font-size: 13px; line-height: 1.5; }
      canvas { image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <span id="home-name"></span>
        <span class="score" id="score">0 - 0</span>
        <span id="away-name"></span>
        <span id="clock">00:00</span>
        <button id="spd1" class="active">1x</button>
        <button id="spd4">4x</button>
        <button id="spd12">12x</button>
        <button id="newmatch">New Match</button>
      </div>
      <div id="game"></div>
      <div id="ticker"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
