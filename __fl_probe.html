<!doctype html><html><head><meta charset="utf-8"><style>
body { background:#12121f; color:#eee; font-family: system-ui, sans-serif; }
.cg-foc { text-align: left; padding: 12px 14px; border-radius: 10px; background: #1b1b30; border: 1px solid #34345c; cursor: pointer; }
.cg-foc .cg-effs { font-size: 15px; color: #a9e0c0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 11px; margin-top: 3px; font-weight: 600; }
.cg-foc .cg-effs > span { display: inline-flex; align-items: center; gap: 2px; }
.cg-foc .cg-effs > span::first-letter { font-size: 17px; }
/* control: same rule, but the span is a block container */
#ctrl.cg-foc .cg-effs > span { display: block; }
</style></head><body>
<div class="cg-foc" id="asis"><div class="cg-effs"><span id="a" title="Composure">🧊+3</span></div></div>
<div class="cg-foc" id="ctrl"><div class="cg-effs"><span id="b" title="Composure">🧊+3</span></div></div>
<div class="cg-foc" id="ib"><div class="cg-effs"><span id="c" title="Composure" style="display:inline-block">🧊+3</span></div></div>
<pre id="out"></pre>
<script>
function firstCharRect(el){ const r=document.createRange(); const t=el.firstChild; r.setStart(t,0); r.setEnd(t,2); const b=r.getBoundingClientRect(); return {w:+b.width.toFixed(2), h:+b.height.toFixed(2)}; }
const rows=[['a (as authored, inline-flex)','a'],['b (control, display:block)','b'],['c (proposed fix, inline-block)','c']]
  .map(([lbl,id])=>{const el=document.getElementById(id); return lbl+' | computed display='+getComputedStyle(el).display+' | firstChar '+JSON.stringify(firstCharRect(el))+' | ::first-letter font-size='+getComputedStyle(el,'::first-letter').fontSize;});
document.getElementById('out').textContent = rows.join('\n');
window.__res = rows.join('\n');
</script></body></html>
