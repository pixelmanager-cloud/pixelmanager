name: CI

# Gates every PR (including the dev agent's) before it can be merged to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # CI RAN `verify` AND NOTHING ELSE, and `verify` is 18 of the project's 112 harnesses (16%).
      # The other 94 — every qa fuzz harness and 52 of the 53 playtest probes — ran only when a human
      # remembered to type `npm run gate` locally. Every gate repair made this week protected a command
      # nobody was obliged to run.
      #
      # They were then added as three separate steps -- which still did not run. GitHub stops a job at the
      # first failing step unless told otherwise, and `verify` ends in shared/strategy_test.ts, which exits 1
      # BY DESIGN on four assertions section 68 documents as permanently red. So the playtest and qa steps
      # never executed once on a red-verify tree, under a comment claiming all three legs ran.
      #
      # `npm run gate` now runs all three unconditionally and judges the result against
      # scripts/gate-baseline.txt: an accepted failure is not a gate failure, a NEW one is. It prints each
      # leg's exit code, so a break still names its leg.
      # The browser smoke test needs a real chromium. Without this step tools/playtest/browser_smoke.ts
      # FAILS rather than skipping, which is deliberate -- a browser gate that quietly skips reads as
      # evidence that the game runs when nothing has checked.
      - name: Install chromium for the browser smoke test
        run: npx playwright install --with-deps chromium

      - name: Gate (verify + playtest + qa, judged against the accepted-failure baseline)
        run: npm run gate
